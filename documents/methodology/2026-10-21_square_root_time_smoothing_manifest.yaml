  code_revision: 9c3b863   # recorded in every metadata.yaml at --init-only; no tracked modification
  hyperparameters: identical to butterfly_real_line_2026-10-09 and exact_trace_circle_2026-10-20, checked at --init-only
  run_directories: data/ablation_split_extension_trained/square_root_time_smoothing_2026-10-21/ (Jean Zay)
  slurm_logs: data/ablation_split_extension_trained/square_root_time_smoothing_2026-10-21/slurm/ (Jean Zay)
