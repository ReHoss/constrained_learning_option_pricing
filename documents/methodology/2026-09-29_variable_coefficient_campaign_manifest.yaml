cross_hardware:
  within_cell: none; every cell runs on one hardware, so the freezing-point comparison of a cell
    is made on identical arithmetic.
  across_cells: >
    the LV4 amplitude comparison (dose-response) compares epsilon = 0.25 (V100) with
    epsilon = 0.75 (MI250); the LV2 cells (MI250) are compared with the G2 anchor (V100).
    Evidence on the size of the hardware effect: the 300-iteration smoke runs of LV4
    epsilon = 0.75, seed 0, on V100 (job 309020) and on MI250 (job 5480592) gave the same best
    loss and relative L2 error to four significant digits for all four variants
    (e.g. split_frozen_singular: 1.517e-4 and 3.487e-2 on both); this is a short-run
    indication, not a measurement of the effect after 20000 iterations.
copies:
  - the LV2 run directories were produced on Adastra and copied (rsync, without optimiser
    checkpoints) to Jean Zay and to the laptop, for the joint aggregation; the copies are
    identical in content and name, and their logs record the Adastra command paths.
