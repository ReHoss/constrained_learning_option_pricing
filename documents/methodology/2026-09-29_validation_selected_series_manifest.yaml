# Validation-selected model series (pre-registration
# documents/methodology/2026-09-29_preregistration_validation_selected_series.md).
# The series the paper reports. Every cell runs on one hardware; all runs retain the state of
# lowest residual on a fixed validation set (16384 uniform points, own derived seed, every 100
# iterations and at the last one, the evaluated parameters saved). Output subfolder:
# data/ablation_split_extension_trained/series_validation_selected/ (aggregate with --data-root).
